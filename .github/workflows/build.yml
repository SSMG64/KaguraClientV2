name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PS3DK_TAG: v0.19.0
  PS3DK_WINDOWS_SHA256: 3b2a7adfcdde5607ef22c0520e2f5911706a5e2b5275c2035f14ad2193f880ae

jobs:
  toolchain:
    name: Toolchain (PS3DK v0.19.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Kagura
        uses: actions/checkout@v7

      - name: Restore toolchain cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/ps3dk-toolchain
          key: ps3dk-ubuntu-24.04-${{ hashFiles('scripts/setup-ps3dk.sh') }}

      - name: Install host dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build patch python3 git curl xz-utils \
              libgmp-dev libelf-dev libssl-dev zlib1g-dev

      - name: Install Rust if the runner has none
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the toolchain and SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/setup-ps3dk.sh

      - name: Check the toolchain is complete
        run: |
          source ~/ps3dk-toolchain/env.sh
          test -x "$PS3DEV/ppu/bin/powerpc64-ps3-elf-g++"
          test -f "$PS3DK/ppu/lib/lv2-prx.specs"
          test -f "$PS3DK/ppu/lib/lv2-prx.ld"
          test -f "$PS3DK/ppu/lib/lv2-prx-crt.o"

  build:
    name: Plugin (${{ matrix.type }})
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        type: [Debug, Release]
    steps:
      - name: Check out Kagura
        uses: actions/checkout@v7

      - name: Restore toolchain cache
        uses: actions/cache/restore@v5
        with:
          path: ~/ps3dk-toolchain
          key: ps3dk-ubuntu-24.04-${{ hashFiles('scripts/setup-ps3dk.sh') }}
          fail-on-cache-miss: true

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Toolchain smoke test (PS3DK example SPRX)
        run: |
          source ~/ps3dk-toolchain/env.sh
          cmake -S "$PS3_TOOLCHAIN_ROOT/samples/lv2/hello-sprx-export" -B "$RUNNER_TEMP/smoke" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$PS3_TOOLCHAIN_ROOT/cmake/ps3-ppu-toolchain.cmake"
          cmake --build "$RUNNER_TEMP/smoke"

      - name: Build Kagura Client V2
        run: ./scripts/build.sh ${{ matrix.type }}

      - name: Check the plugin files exist
        run: |
          test -s build/out/KaguraClientV2.prx
          test -s build/out/KaguraClientV2.sprx
          test -s build/out/KaguraClientV2.fake.sprx

      - name: Upload plugin
        uses: actions/upload-artifact@v6
        with:
          name: KaguraClientV2-${{ matrix.type }}
          path: build/out/*

  windows:
    name: Plugin on Windows (experimental)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Check out Kagura
        uses: actions/checkout@v7

      - name: Install Ninja
        shell: pwsh
        run: |
          python -m pip install ninja
          python -c "import ninja; print(ninja.BIN_DIR)" >> $env:GITHUB_PATH

      - name: Download the prebuilt PS3DK for Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "ps3-sdk-$env:PS3DK_TAG-windows-x86_64.zip"
          gh release download $env:PS3DK_TAG --repo FirebirdTA01/PS3DK --pattern $name --dir "$env:RUNNER_TEMP\ps3dk-zip"
          $zip = Join-Path "$env:RUNNER_TEMP\ps3dk-zip" $name
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:PS3DK_WINDOWS_SHA256) { throw "Checksum mismatch for $name : $hash" }
          New-Item -ItemType Directory -Force -Path C:\ps3dk | Out-Null
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
              7z x $zip -oC:\ps3dk -y | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          } else {
              Expand-Archive -Path $zip -DestinationPath C:\ps3dk -Force
          }

      - name: Set up the PS3DK environment
        shell: pwsh
        run: |
          $root = (Get-ChildItem C:\ps3dk -Directory | Where-Object { Test-Path (Join-Path $_.FullName "cmake\ps3-ppu-toolchain.cmake") } | Select-Object -First 1).FullName
          if (-not $root) { Get-ChildItem C:\ps3dk | Format-Table; throw "toolchain file not found under C:\ps3dk" }
          "PS3DK=$root" >> $env:GITHUB_ENV
          "PS3DEV=$root" >> $env:GITHUB_ENV
          "PSL1GHT=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
          "$root\ppu\bin" >> $env:GITHUB_PATH
          "$root\spu\bin" >> $env:GITHUB_PATH

      - name: Show the tools
        shell: pwsh
        run: |
          Write-Host "PS3DK = $env:PS3DK"
          powerpc64-ps3-elf-gcc.exe --version
          ninja --version
          cmake --version

      - name: Build Kagura Client V2
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$env:PS3DK\cmake\ps3-ppu-toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build

      - name: Upload plugin
        uses: actions/upload-artifact@v6
        with:
          name: KaguraClientV2-Windows
          path: build/out/*
